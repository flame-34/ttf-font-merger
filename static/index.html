<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTF 字体合并工具</title>
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo"><img src="/static/icon.svg" alt="TTF" width="36" height="36"></span>
    <div>
      <h1>字体合并工具</h1>
      <p>选择主体字体 → 用多个补丁字体分别补齐不同语言的字形</p>
    </div>
  </div>
  <div class="status" id="serverStatus"><span class="dot"></span>就绪</div>
</header>

<main class="wrap">
  <section class="step-grid">
    <div class="panel" id="mainPanel">
      <div class="panel-head">
        <span class="step-no">1</span>
        <h2>主体字体</h2>
        <span class="panel-sub" id="mainSub">作为合并的基础</span>
      </div>
      <label class="dropzone" id="mainDrop">
        <input type="file" id="mainFile" accept=".ttf,.otf,.ttc" hidden>
        <div class="dz-inner">
          <div class="dz-icon">＋</div>
          <div class="dz-text">选择或拖入 <b>主体 TTF</b></div>
          <div class="dz-hint">支持 .ttf / .otf / .ttc</div>
        </div>
      </label>
      <div class="meta hidden" id="mainMeta"></div>
    </div>

    <div class="panel" id="patchPanel">
      <div class="panel-head">
        <span class="step-no">2</span>
        <h2>补丁字体</h2>
        <span class="panel-sub" id="patchSub">从中抽取缺失字形</span>
      </div>
      <div class="patch-tabs" id="patchTabs"></div>
      <label class="dropzone dz-compact" id="patchDrop">
        <input type="file" id="patchFile" accept=".ttf,.otf,.ttc" hidden multiple>
        <div class="dz-inner compact">
          <span class="dz-text">＋ 添加补丁字体（可多选）</span>
        </div>
      </label>
      <div class="meta hidden" id="patchMeta"></div>
    </div>
  </section>

  <section class="panel blocks-panel">
    <div class="panel-head">
      <h2>Unicode 区块覆盖</h2><span class="panel-sub" id="tableSub">为当前补丁选择要合并的区块</span>
      <div class="filters">
        <input type="search" id="searchBox" placeholder="搜索区块 / 语言 / 文字…" class="search">
        <label class="toggle"><input type="checkbox" id="onlyFillable"><span>仅显示可合并区块</span></label>
        <select id="catFilter" class="select"><option value="">全部分类</option></select>
        <button class="btn ghost" id="checkAll" title="勾选当前补丁提供的全部区块">勾选当前可合并</button>
      </div>
    </div>
    <div class="legend">
      <span class="lg"><i class="sw missing"></i>主体缺失</span>
      <span class="lg"><i class="sw present"></i>主体已含</span>
      <span class="lg"><i class="sw fill"></i>补丁提供</span>
      <span class="lg dim" id="summaryBar">载入主体字体后显示覆盖情况</span>
    </div>
    <div class="table-scroll">
      <table class="blocks" id="blockTable">
        <thead>
          <tr>
            <th class="c-check"><input type="checkbox" id="headCheck" title="全选/取消当前列表中的可补丁项"></th>
            <th>区块</th>
            <th>语言 / 文字</th>
            <th class="c-range">码位范围</th>
            <th class="c-cov">主体覆盖</th>
            <th class="c-fill">补丁提供</th>
          </tr>
        </thead>
        <tbody id="blockBody">
          <tr class="empty-row"><td colspan="6">请先载入主体字体。</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="merge-bar" id="mergeBar">
    <label class="toggle ow-toggle"><input type="checkbox" id="overwriteMain" checked><span>覆盖主体已有字形</span></label>
    <div class="merge-info">
      <b id="selPatches">0</b> 个补丁 · 已选 <b id="selBlocks">0</b> 个区块 · 将合并 <b id="selCps">0</b> 个码位
    </div>
    <button class="btn primary" id="mergeBtn" disabled>合并并下载</button>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
