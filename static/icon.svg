<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d5d57"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="url(#bg)"/>
  <!-- font metric guide lines: cap-height + baseline -->
  <line x1="8" y1="15" x2="56" y2="15" stroke="#fff" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <line x1="8" y1="53" x2="56" y2="53" stroke="#fff" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="3 2.5"/>
  <!-- large serif T (typography mark) -->
  <path d="M 9 17 L 55 17 L 55 23 L 38 23 L 38 51 L 26 51 L 26 23 L 9 23 Z" fill="#ffffff"/>
  <!-- small lowercase 'tf' at bottom-right -->
  <text x="45" y="56" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="600" fill="#fff" fill-opacity="0.7">tf</text>
</svg>
